# Lints and builds every pull request. After a merge to main, builds the app
# and uploads it to the server (what ./deploy.sh does by hand). The SSH key
# in DEPLOY_SSH_KEY can only upload files into /srv/calendar-web.
name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button on GitHub, to deploy by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-calendar-app # one upload at a time, in order
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to /srv/calendar-web, so "./" means that folder.
          rsync -rlptz --delete -e "ssh -i ~/.ssh/deploy" dist/ esteban@206.189.176.206:./
